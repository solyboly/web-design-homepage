<!doctype html>
<html>
    <head>
        <title>specificity</title>
        <link rel="stylesheet" href="../assets/specificyt.css">
        <style>
            /* embedded styles are more specific than external styles, but less specific than inline styles */
            header {
                background:lightgreen;
            }
        </style>
    </head>
    <body>
      <h1>Specificity</h1> 
      
      <!-- inline styles are the most specific-->
      <header style="background:lightcoral;">
        Stylesheet Specificity <br>
        external < embedded < inline
      </header>

      <main class="class" id="id">
        Identifier Specificity <br>
        tag < class < id
      </main>

      <footer>
        Location Specificity <br>
        higher < lower
      </footer>
    </body>
</html>
